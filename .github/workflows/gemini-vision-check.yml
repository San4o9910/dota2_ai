name: Gemini credential check without inference

on:
  push:
    branches: [codex/replay-map-hardening-8ea829a]
    paths:
      - .github/workflows/gemini-vision-check.yml
      - ops/timeweb/gemini_preflight.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-vision-smoke
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.repository == 'San4o9910/dota2_ai' &&
      github.ref == 'refs/heads/codex/replay-map-hardening-8ea829a'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify model access without spending the analysis allowance
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 ops/timeweb/gemini_preflight.py
