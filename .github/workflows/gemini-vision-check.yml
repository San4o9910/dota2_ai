name: Gemini vision smoke

on:
  push:
    branches: [codex/replay-map-hardening-8ea829a]
    paths:
      - .github/workflows/gemini-vision-check.yml
      - ops/timeweb/vision_smoke.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-vision-smoke
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.repository == 'San4o9910/dota2_ai' &&
      github.ref == 'refs/heads/codex/replay-map-hardening-8ea829a'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build pinned Python service image
        run: docker build --tag narma-vision-smoke services/video
      - name: One bounded vision request on four synthetic frames
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: docker run --rm --env GEMINI_API_KEY --env PYTHONPATH=/app --volume "$PWD/ops/timeweb:/checks:ro" narma-vision-smoke python /checks/vision_smoke.py
