name: OpenAI server key preparation (no generation)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect configuration or install the first OpenAI API key
        type: choice
        options: [inspect, install-key]
        default: inspect
        required: true
      expected_release:
        description: Exact 40-character installed VPS release SHA (not the workflow SHA)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: timeweb-pilot-deployment
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'San4o9910/dota2_ai' && (github.ref == 'refs/heads/codex/openai-video-coach' || github.ref == 'refs/heads/codex/replay-map-hardening-8ea829a')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate server-only configuration without secrets
        run: python3 -m unittest discover -s ops/timeweb/tests -p test_openai_preparation.py
      - name: Prepare existing server without restarting services or changing budgets
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          OPENAI_API_KEY: ${{ inputs.mode == 'install-key' && secrets.OPENAI_API_KEY || '' }}
          SUPPORT_MODE: ${{ inputs.mode }}
          EXPECTED_RELEASE: ${{ inputs.expected_release }}
        run: python3 ops/timeweb/openai_support.py --mode "$SUPPORT_MODE" --expected-release "$EXPECTED_RELEASE"
