name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      SITES_BUILD_TIMEOUT: 5m
      SITES_BUILD_KILL_AFTER: 15s

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck Worker and application
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Build Worker package
        run: npm run build

      - name: Verify standalone portal in desktop and mobile browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/narma-browser" --no-package-lock --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/narma-browser/node_modules/playwright/cli.js" install --with-deps chromium
          PLAYWRIGHT_NODE_MODULES="$RUNNER_TEMP/narma-browser/node_modules" node scripts/check-portal-ui.mjs

      - name: Verify package contract and build-dependent tests
        run: npm run verify:package

      - name: Query dependency advisories
        run: npm run audit:advisory
