name: STRATZ source verification

on:
  push:
    branches: [codex/replay-map-hardening-8ea829a]
    paths:
      - .github/workflows/stratz-source-check.yml
      - scripts/inspect-stratz-builds.py
      - scripts/check-stratz-build-data.py
      - scripts/check-stratz-context.py
      - services/video/narma_video/build_meta.py
      - services/video/narma_video/build_statistics.py
  workflow_dispatch:
    inputs:
      inspect_schema:
        description: Explicitly inspect full schema metadata
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stratz-source-verification
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.repository == 'San4o9910/dota2_ai' &&
      github.ref == 'refs/heads/codex/replay-map-hardening-8ea829a'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require the configured credential
        env:
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}
        run: |
          if [[ -z "${STRATZ_API_TOKEN:-}" ]]; then
            echo 'STRATZ_API_TOKEN is not configured for this repository workflow'
            exit 1
          fi
      - name: Inspect schema only when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.inspect_schema
        env:
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}
        run: python3 scripts/inspect-stratz-builds.py
      - name: Verify the production adapter without server deployment
        env:
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}
          PYTHONPATH: services/video
        run: |
          python3 -m pip install --disable-pip-version-check --quiet fastapi==0.141.1 httpx==0.28.1
          python3 -m narma_video.build_meta --check
