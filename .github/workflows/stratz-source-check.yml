name: STRATZ source verification

on:
  push:
    branches: [codex/replay-map-hardening-8ea829a]
    paths:
      - .github/workflows/stratz-source-check.yml
      - scripts/inspect-stratz-builds.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stratz-source-verification
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.repository == 'San4o9910/dota2_ai' &&
      github.ref == 'refs/heads/codex/replay-map-hardening-8ea829a'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify authorized schema without deployment or match requests
        env:
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}
        run: |
          if [[ -z "${STRATZ_API_TOKEN:-}" ]]; then
            echo 'STRATZ_API_TOKEN is not configured for this repository workflow'
            exit 1
          fi
          python3 scripts/inspect-stratz-builds.py
