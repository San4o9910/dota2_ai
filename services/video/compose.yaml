x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: narma
      POSTGRES_USER: narma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U narma -d narma"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1
    logging: *logging
  migrate:
    build: .
    command: [python, -m, narma_video.db]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    logging: *logging
  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      VIDEO_SERVICE_TOKEN: ${VIDEO_SERVICE_TOKEN:?Set VIDEO_SERVICE_TOKEN}
      NARMA_BUILD_STATS_SOURCE: ${NARMA_BUILD_STATS_SOURCE:-authored}
      STRATZ_API_TOKEN: ${STRATZ_API_TOKEN:-}
      NARMA_STRATZ_REFRESH_ENABLED: ${NARMA_STRATZ_REFRESH_ENABLED:-1}
      VIDEO_STORAGE_PATH: /var/lib/narma/video
      VIDEO_FRAME_BUDGET: ${VIDEO_FRAME_BUDGET:-3600}
      VIDEO_ANALYSIS_MODE: ${VIDEO_ANALYSIS_MODE:-full_frames_v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      OPENAI_MAX_DAILY_CALLS: ${OPENAI_MAX_DAILY_CALLS:-20}
      APP_ORIGIN: ${APP_ORIGIN:-https://narma-72-56-98-68.sslip.io}
      PORTAL_SETUP_TOKEN_SHA256: ${PORTAL_SETUP_TOKEN_SHA256:-}
      PORTAL_SETUP_EXPIRES_AT: ${PORTAL_SETUP_EXPIRES_AT:-}
      NARMA_CHATGPT_ENCRYPTION_KEY: ${NARMA_CHATGPT_ENCRYPTION_KEY:-}
      NARMA_CHATGPT_OWNER_ID: ${NARMA_CHATGPT_OWNER_ID:-}
      NARMA_CHATGPT_MAX_DAILY_CALLS: ${NARMA_CHATGPT_MAX_DAILY_CALLS:-6}
      REPLAY_COACH_PROVIDER: ${REPLAY_COACH_PROVIDER:-gemini}
      HERMES_PROVIDER: ${HERMES_PROVIDER:-gemini}
    ports: ["127.0.0.1:8080:8080"]
    volumes: [media:/var/lib/narma/video]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=15).close()"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s
  worker:
    profiles: [analysis]
    build: .
    command: [python, -m, narma_video.worker]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      VIDEO_STORAGE_PATH: /var/lib/narma/video
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:?Select a supported vision model}
      VIDEO_FRAME_BUDGET: ${VIDEO_FRAME_BUDGET:-3600}
      VIDEO_REQUEST_BUDGET: ${VIDEO_REQUEST_BUDGET:-250}
      VIDEO_OWNER_DAILY_REQUEST_BUDGET: ${VIDEO_OWNER_DAILY_REQUEST_BUDGET:-1000}
      VIDEO_ANALYSIS_MODE: ${VIDEO_ANALYSIS_MODE:-full_frames_v1}
      REPLAY_COACH_PROVIDER: ${REPLAY_COACH_PROVIDER:-gemini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      OPENAI_MAX_DAILY_CALLS: ${OPENAI_MAX_DAILY_CALLS:-20}
    volumes: [media:/var/lib/narma/video]
    tmpfs: ["/tmp:size=192m,mode=1777"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    logging: *logging
  replay-worker:
    profiles: [analysis]
    build:
      context: ../..
      dockerfile: services/replay/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      VIDEO_STORAGE_PATH: /var/lib/narma/video
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      REPLAY_PARSER_HOME: /opt/narma/replay
      NARMA_CHATGPT_ENCRYPTION_KEY: ${NARMA_CHATGPT_ENCRYPTION_KEY:-}
      NARMA_CHATGPT_OWNER_ID: ${NARMA_CHATGPT_OWNER_ID:-}
      NARMA_CHATGPT_MAX_DAILY_CALLS: ${NARMA_CHATGPT_MAX_DAILY_CALLS:-6}
      REPLAY_COACH_PROVIDER: ${REPLAY_COACH_PROVIDER:-gemini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      OPENAI_MAX_DAILY_CALLS: ${OPENAI_MAX_DAILY_CALLS:-20}
    volumes: [media:/var/lib/narma/video]
    tmpfs: ["/tmp:size=128m,mode=1777"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    cpus: 2
    pids_limit: 128
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    logging: *logging
  hermes-broker:
    profiles: [hermes]
    build: .
    command: [uvicorn, narma_video.hermes_broker:app, --host, 0.0.0.0, --port, "8091", --no-access-log]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      VIDEO_OWNER_DAILY_REQUEST_BUDGET: ${VIDEO_OWNER_DAILY_REQUEST_BUDGET:-250}
      HERMES_RUNTIME_ENABLED: ${HERMES_RUNTIME_ENABLED:-1}
      HERMES_RUNNER_URL: http://hermes-runner:8092
      NARMA_CHATGPT_ENCRYPTION_KEY: ${NARMA_CHATGPT_ENCRYPTION_KEY:-}
      NARMA_CHATGPT_OWNER_ID: ${NARMA_CHATGPT_OWNER_ID:-}
      NARMA_CHATGPT_MAX_DAILY_CALLS: ${NARMA_CHATGPT_MAX_DAILY_CALLS:-6}
      HERMES_PROVIDER: ${HERMES_PROVIDER:-gemini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      OPENAI_MAX_DAILY_CALLS: ${OPENAI_MAX_DAILY_CALLS:-20}
    networks: [default, hermes-private]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 1
    pids_limit: 64
    depends_on:
      migrate: {condition: service_completed_successfully}
      hermes-runner: {condition: service_healthy}
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  hermes-runner:
    profiles: [hermes]
    build:
      context: ../..
      dockerfile: services/hermes/Dockerfile
    environment:
      HERMES_BROKER_URL: http://hermes-broker:8091/v1
    networks: [hermes-private]
    tmpfs: ["/tmp:size=256m,mode=1777"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD, /opt/hermes-venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/healthz', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
networks:
  hermes-private:
    internal: true
volumes:
  database:
  media:
